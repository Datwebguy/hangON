<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HangON cover</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1920px; height: 1080px; overflow: hidden; font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    background: radial-gradient(90% 120% at 85% 20%, #123b2f 0%, #0b0f0e 55%); color: #e9f0ed; position: relative; }
  .left { position: absolute; left: 120px; top: 0; bottom: 0; width: 760px; display: flex; flex-direction: column; justify-content: center; }
  .logo { width: 110px; height: 110px; border-radius: 26px; }
  h1 { font-size: 150px; font-weight: 800; letter-spacing: -.05em; line-height: 1; margin-top: 40px; }
  .tag { font-size: 50px; font-weight: 700; line-height: 1.2; margin-top: 30px; letter-spacing: -.02em; }
  .tag span { color: #34d399; }
  .sub { font-size: 30px; color: #95a59f; margin-top: 26px; line-height: 1.4; }
  .pill { display: inline-block; margin-top: 44px; font-size: 24px; font-weight: 700; color: #0b0f0e; background: #34d399; border-radius: 999px; padding: 12px 26px; align-self: flex-start; }
  .shot { position: absolute; left: 960px; top: 150px; width: 1120px; border-radius: 22px; box-shadow: 0 40px 100px rgba(0,0,0,.55); transform: rotate(-2deg); }
  .bubble { position: absolute; background: #fff; color: #0f1b17; border-radius: 22px; padding: 22px 28px; font-size: 27px; line-height: 1.35; box-shadow: 0 20px 50px rgba(0,0,0,.4); max-width: 520px; }
  .bubble b { display: block; font-size: 18px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px; }
  .c b { color: #64748b; } .a b { color: #0b9468; }
</style>
</head>
<body>
  <div class="left">
    <img class="logo" src="../hangon-logo.png" alt="">
    <h1>HangON</h1>
    <div class="tag">Never miss a job while <span>your hands are full.</span></div>
    <div class="sub">The AI front desk that answers, books and confirms calls for solo trades.</div>
    <div class="pill">Built on AssemblyAI</div>
  </div>
  <img class="shot" src="img/booked.jpg" alt="">
  <div class="bubble c" style="left:900px;top:640px"><b>Caller</b>"Tuesday… actually, no. Make it Wednesday at 2."</div>
  <div class="bubble a" style="left:1300px;top:820px"><b>HangON</b>"Mike is actually booked at two PM on Wednesday. Would you be available on Friday…?"</div>
</body>
</html>
